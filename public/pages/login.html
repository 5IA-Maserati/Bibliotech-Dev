<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca Digitale | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/style/login.css">
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <h1>Biblioteca Digitale</h1>
        <p class="subtitle">Accesso studenti e docenti</p>

        <form id="login-form">
            <div class="input-group">
                <input type="text" id="username" required>
                <label>Username</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" required>
                <label>Password</label>
            </div>

            <div class="buttons">
                <button type="submit">Accedi</button>
                <a href="signup.html" class="register-btn">Registrati</a>
            </div>
        </form>

        <p class="footer-text">© 2026 Biblioteca Scolastica</p>
    </div>
</div>

<script src="../assets/js/login.js"></script>
</body>
</html>
