name: Deploy PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-pr:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout Repo
        uses: actions/checkout@v4

      # =========================
      # Create filtered folder ONLY (no git hacks)
      # =========================
      - name: Create filtered deploy content
        run: |
          mkdir filtered

          rsync -av \
            --include='src/***' \
            --include='public/***' \
            --include='composer.json' \
            --include='composer.lock' \
            --exclude='*' \
            ./ filtered/

      # =========================
      # Create PR ONLY (like image workflow)
      # =========================
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: deploy
          title: Deploy PR from main
          branch: deploy-auto-${{ github.sha }}
          commit-message: Deploy snapshot from main
          body: |
            Auto-generated deploy PR

            Source: main  
            Target: deploy  

            Contains filtered production-ready code only.
