name: Deploy PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-pr:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout main
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 2. Create filtered snapshot (ONLY LOCAL)
      # =========================
      - name: Build filtered content
        run: |
          mkdir filtered

          rsync -av \
            --include='src/***' \
            --include='public/***' \
            --include='composer.json' \
            --include='composer.lock' \
            --exclude='*' \
            ./ filtered/

      # =========================
      # 3. Create TEMP branch ONLY in runner
      # =========================
      - name: Create temp branch
        run: |
          git checkout --orphan deploy-temp

          rm -rf .
          cp -r filtered/* .

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Filtered deploy snapshot from main"

      # =========================
      # 4. Create PR (NO PUSH MANUAL)
      # =========================
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: deploy
          head: deploy-temp
          title: Deploy PR from main
          body: |
            Auto-generated PR

            Source: main  
            Target: deploy  

            Contains filtered production-ready build.
          draft: true
          delete-branch: true
