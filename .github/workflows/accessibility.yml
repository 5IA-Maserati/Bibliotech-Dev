name: Accessibility Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PATH_TO_SCAN: "."
  REPORT_FILE: "accessibility-report.json"

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository
      - uses: actions/checkout@v4

      # 2. Run be-a11y on local files
      - name: Run accessibility checker
        id: a11ychecker
        uses: be-lenka/be-a11y@v2.2.8
        continue-on-error: true
        with:
          url: ${{ env.PATH_TO_SCAN }}
          report: ${{ env.REPORT_FILE }}

      # 3. Upload accessibility report artifact
      - name: Upload accessibility report artifact
        if: ${{ steps.a11ychecker.outcome != 'success' && env.REPORT_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: warn

      # 4. Fail job if accessibility issues found
      - name: Fail job if accessibility issues detected
        run: |
          # Check if jq is installed
          if ! command -v jq &> /dev/null; then
            echo "jq is required but not installed. Installing..."
            sudo apt-get update && sudo apt-get install -y jq
          fi

          # Count number of issues in JSON report
          ISSUES=$(jq 'length' ${{ env.REPORT_FILE }})
          echo "Found $ISSUES accessibility issues."

          if [ "$ISSUES" -gt 0 ]; then
            echo "Accessibility issues detected. Failing the job."
            exit 1
          fi

      # 5. Output artifact info
      - name: Output artifact path
        run: echo "Accessibility report saved at ${{ env.REPORT_FILE }}"
