name: Deploy PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-pr:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout main
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 2. Build filtered snapshot
      # =========================
      - name: Create filtered deploy folder
        run: |
          mkdir filtered

          rsync -av \
            --include='src/***' \
            --include='public/***' \
            --include='composer.json' \
            --include='composer.lock' \
            --exclude='*' \
            ./ filtered/

      # =========================
      # 3. Create temporary branch from snapshot
      # =========================
      - name: Create temp deploy branch
        run: |
          git checkout --orphan deploy-temp

          git clean -fd

          cp -r filtered/. .

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Filtered deploy snapshot from main"

      # =========================
      # 4. Create PR (NO direct push to deploy)
      # =========================
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: deploy
          head: deploy-temp
          title: Deploy PR from main
          body: |
            Automated deploy PR

            - Source: main
            - Target: deploy
            - Contains filtered production-ready files only

            Merge this PR to deploy changes.
          draft: false
          delete-branch: true
