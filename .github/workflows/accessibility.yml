name: Accessibility Check

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3. Install pa11y globally
      - name: Install pa11y
        run: npm install -g pa11y

      # 4. Find all HTML files in the project
      - name: Find all HTML files
        id: find_html
        run: |
          HTML_FILES=$(find . -name "*.html")
          echo "HTML_FILES=$HTML_FILES" >> $GITHUB_ENV

      # 5. Run accessibility tests on all HTML files
      - name: Run Accessibility Tests
        run: |
          mkdir -p accessibility-reports
          FAIL=0
          for FILE in $HTML_FILES; do
            echo "Testing $FILE"
            # Run pa11y and generate HTML report for each file
            pa11y "file://$(pwd)/$FILE" --reporter html --output "accessibility-reports/pa11y-$(basename $FILE).html" || FAIL=1
          done
          
          # Fail the job if any accessibility issues were found
          if [ $FAIL -eq 1 ]; then
            echo "Some accessibility issues were found."
            exit 1
          fi

      # 6. Upload HTML reports as artifacts
      - name: Upload Accessibility Reports
        uses: actions/upload-artifact@v3
        with:
          name: accessibility-reports
          path: accessibility-reports/*.html
