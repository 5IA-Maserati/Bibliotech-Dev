name: Super-Linter

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # 1 Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2 Run Super-Linter
      - name: Run Super-Linter
        uses: github/super-linter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          LOG_LEVEL: WARN
          VALIDATE_JSCPD: false
          FILTER_REGEX_EXCLUDE: "rutime/vendor/.*|installer/.*|dist/|build/"

      # 3 Run JSCPD
      - name: Run JSCPD
        run: |
          npx jscpd \
            --threshold 10 \
            --min-lines 5 \
            --min-tokens 50 \
            --ignore "**/node_modules/**,**/dist/**,**/build/**"
