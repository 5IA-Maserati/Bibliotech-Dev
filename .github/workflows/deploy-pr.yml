name: Deploy PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # Build filtered snapshot
      # =========================
      - name: Build filtered deploy content
        run: |
          mkdir deploy-build

          rsync -av \
            --include='src/***' \
            --include='public/***' \
            --include='composer.json' \
            --include='composer.lock' \
            --exclude='*' \
            ./ deploy-build/

      # =========================
      # Prepare deploy branch
      # =========================
      - name: Create deploy branch content
        run: |
          git checkout -B deploy

          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          cp -r deploy-build/* .
          rm -rf deploy-build

      - name: Commit deploy snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Deploy snapshot from main" || echo "No changes"

      # =========================
      # Create PR
      # =========================
      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: deploy
          title: Deploy PR from main
          body: |
            Auto-generated deploy PR

            Source: main  
            Target: deploy  

            Contains filtered production-ready code.
          branch: deploy-update
          commit-message: Deploy snapshot from main
