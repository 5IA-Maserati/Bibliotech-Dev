name: Deploy PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      # =========================
      # Build filtered folder
      # =========================
      - name: Build filtered snapshot
        run: |
          rm -rf filtered
          mkdir -p filtered

          rsync -av \
            --include='src/***' \
            --include='public/***' \
            --include='composer.json' \
            --include='composer.lock' \
            --exclude='*' \
            ./ filtered/

      # =========================
      # Create PR (NO manual git!)
      # =========================
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GH_PAT }}

          base: deploy
          title: "Deploy PR from main"
          body: |
            Auto-generated deploy PR

            Source: main
            Target: deploy

            This PR contains filtered production-ready code only.

          branch: deploy-auto
          delete-branch: true

          commit-message: "Deploy snapshot from main"
