name: Spell Check

on: [push, pull_request]

permissions:
  contents: write

jobs:
  check-spelling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install cheerio glob

      - name: Strip visible HTML text (allow Italian)
        run: node scripts/strip-visible-text.js

      - name: Spell check
        uses: check-spelling/check-spelling@v0.0.25
