<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca Scolastica</title>
    <!-- Stylesheet: main page styles -->
    <link rel="stylesheet" href="/assets/style/index.css">
</head>
<body>

    <!-- Header: site logo area and login button -->
    <header class="navbar">
        <div class="logo-area">
            <div class="logo-placeholder">LOGO 1</div>
            <div class="logo-placeholder">LOGO 2</div>
        </div>
        <!-- Primary action: login -->
        <a href="/pages/login.html" class="btn-accedi-text">Accedi</a>
    </header>

    <!-- Quick navigation: important page links -->
    <nav class="quick-nav">
        <a href="/pages/booking.html" class="btn-nav">Restituisci Libro</a>
        <a href="/pages/search.html" class="btn-nav">Cerca</a>
    </nav>

    <!-- Main title -->
    <h1 class="main-title">BIBLIOTECA SCOLASTICA</h1>

    <hr>

    <!-- Main content wrapper -->
    <main class="content-wrapper">
        <!-- Library opening hours section -->
        <section class="orari-mega-container">
            <div class="orari-label">
                <h2>ORARI<br>BIBLIOTECA</h2>
            </div>
            <div class="orari-box">
                <div class="orari-grid">
                    <p><strong>Lun - Ven:</strong> 09:00 - 13:00</p>
                    <hr>
                    <p><strong>Sab - Dom:</strong> Chiuso</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Photo slider: grouped slides for carousel/visuals -->
    <section class="photo-slider-container">
        <div class="slider-track">
            <div class="slide-group">
                <img src="/assets/img/common/biblio-hall.jpg" alt="1">
                <img src="/assets/img/common/biblio-cover.jpg" alt="2">
                <img src="/assets/img/common/biblio-reference.avif" alt="3">
            </div>
            <div class="slide-group">
                <img src="/assets/img/common/biblio-shelf.jpg" alt="4">
                <img src="/assets/img/common/biblio-focus.jpg" alt="5">
                <img src="/assets/img/common/biblio-second-shelf.jpg" alt="6">
            </div>
            <div class="slide-group">
                <!-- Placeholder images used as fallbacks or for demo -->
                <img src="https://via.placeholder.com/300x200?text=Foto+7" alt="7">
                <img src="https://via.placeholder.com/300x200?text=Foto+8" alt="8">
                <img src="https://via.placeholder.com/300x200?text=Foto+9" alt="9">
            </div>
        </div>
    </section>

    <!-- Footer: contact and location -->
    <footer class="footer">
        <div class="footer-info">
            <p><strong>Istituto Scolastico Superiore</strong></p>
            <p>Via della Scuola, 123 - 00100 Città (Prov)</p>
            <p>Tel: 0123 456789 | Email: biblioteca@scuola.edu.it</p>
        </div>
    </footer>

</body>
</html>
