name: Super-Linter

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # 1 Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      # 2 Remove vendor before lint
      # - name: Remove vendor directory
        #run: |
         # echo "Removing vendor directory before linting..."
          # rm -rf vendor runtime/vendor

      # 2 Run Super-Linter
      - name: Run Super-Linter
        uses: github/super-linter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          LOG_LEVEL: WARN
          FILTER_REGEX_EXCLUDE: ".*vendor/.*|.*.dist/.*|.*build/.*|.*runtime/.*"