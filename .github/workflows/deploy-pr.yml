name: Create Deploy PR

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # FILTER STEP
      # =========================
      - name: Prepare filtered view (dry-run only)
        run: |
          mkdir filtered

          rsync -av \
            --include='src/***' \
            --include='public/***' \
            --include='composer.json' \
            --include='composer.lock' \
            --exclude='*' \
            ./ filtered/

      # =========================
      # CREATE PULL REQUEST ONLY
      # =========================
      - name: Create Pull Request main -> deploy
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: deploy
          head: main
          title: "Deploy PR from main"
          body: |
            This PR was automatically generated.

            Source: main  
            Target: deploy  

            Contains filtered production-ready scope.

            Please review CI results before merging.
          draft: true
