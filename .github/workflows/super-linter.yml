  name: Super-Linter

  on:
    push:
      branches: [ main ]
    pull_request:

  jobs:
    fix:

      permissions:
        contents: write
        statuses: write

      runs-on: ubuntu-latest
      outputs:
        pr-branch: auto-lint-fixes
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Run Super-Linter Fix Only
          uses: github/super-linter@v6
          continue-on-error: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            VALIDATE_ALL_CODEBASE: false
            LOG_LEVEL: INFO
            FILTER_REGEX_EXCLUDE: "^(vendor/|\\.git/|\\.dist/|build/|runtime/)"
            LINTER_RULES_PATH: .

            # Enabled fixes for the supported tools
            FIX_CSS_PRETTIER: true
            FIX_HTML_PRETTIER: true
            FIX_JAVASCRIPT_PRETTIER: true
            FIX_MARKDOWN_PRETTIER: true
            FIX_JSON_PRETTIER: true
            FIX_YAML_PRETTIER: true
            FIX_PHP_BUILTIN: true
            FIX_PHP_PHPCS: true
            FIX_PHP_PHPSTAN: false
            FIX_PHP_PSALM: false
            FIX_GITHUB_ACTIONS_ZIZMOR: true
            FIX_JAVASCRIPT_ES: true

        - name: Commit and Push Fixes
          run: |
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git checkout -B auto-lint-fixes
            git add .
            git commit -m "Auto-lint fixes applied" || echo "Nothing to commit"
            git push --set-upstream origin auto-lint-fixes --force

        - name: Set output branch
          run: echo "pr-branch=auto-lint-fixes" >> "$GITHUB_OUTPUT"

    lint:
      needs: fix
      runs-on: ubuntu-latest

      permissions: read-all

      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with:
            submodules: false
            fetch-depth: 0
            ref: ${{ needs.fix.outputs.pr-branch }}

        - name: Run Super-Linter
          uses: github/super-linter@v6
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            VALIDATE_ALL_CODEBASE: true
            LOG_LEVEL: INFO
            FILTER_REGEX_EXCLUDE: "vendor/.*|\\.git/.*|\\.dist/.*|build/.*|runtime/.*"
            LINTER_RULES_PATH: .
