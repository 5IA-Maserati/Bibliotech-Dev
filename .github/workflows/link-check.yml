name: Link Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2.0.2
        with:
          fail: true
          args: >
            --config .lychee.toml
            --exlcude-path "node_module"
            --exclude "^https?://"
            .

      - name: Check external links (non-blocking)
        uses: lycheeverse/lychee-action@v1
        with:
          fail: false
          args: >
            --config .lychee.toml
            .
