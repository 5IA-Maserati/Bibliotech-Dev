name: Detect Non-English Text

on:
  push:
    branches:
      - main

jobs:
  detect-language:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install language detector
        run: pip install langdetect

      - name: Scan repository for non-English text
        run: |
          python << 'EOF'
          import os
          import sys
          from langdetect import detect

          allowed_extensions = (".php", ".html", ".js", ".css", ".txt", ".md")
          ignored_folders = ["vendor", "node_modules", "storage", "tests", ".github", "runtime", "libs"]

          found_non_english = False

          for root, dirs, files in os.walk("."):
              # Remove ignored folders from traversal
              dirs[:] = [d for d in dirs if d not in ignored_folders]

              for file in files:
                  if file.endswith(allowed_extensions):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", errors="ignore") as f:
                              for line_number, line in enumerate(f, start=1):
                                  text = line.strip()
                                  if not text:
                                      continue
                                  try:
                                      lang = detect(text)
                                      if lang != "en":
                                          print(f"\n❌ Non-English detected")
                                          print(f"File: {path}")
                                          print(f"Line {line_number}: {text}")
                                          print(f"Detected language: {lang}")
                                          found_non_english = True
                                  except:
                                      pass
                      except:
                          pass

          if found_non_english:
              print("\n❌ Workflow stopped: Non-English text found.")
              sys.exit(1)

          print("✔ No non-English text detected.")
          EOF

