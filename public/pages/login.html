<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Biblioteca Digitale | Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/style/login.css">
</head>
<body>

<header class="navbar">
    <div class="logo-area">
        <div class="logo-placeholder" aria-hidden="true">LOGO 1</div>
        <div class="logo-placeholder" aria-hidden="true">LOGO 2</div>
    </div>
    <div class="container">
        <h1>Biblioteca Digitale</h1>
        <p>Accedi o registrati per entrare nella piattaforma</p>
    </div>
</header>

<div class="login-container">
    <div class="login-card">
        <h2>Biblioteca Digitale</h2>
        <p class="subtitle">Accesso studenti e docenti</p>

        <form id="login-form">
            <div class="input-group">
                <input type="text" id="username" required aria-label="Inserisci il tuo username">
                <label for="username">Username</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" required aria-label="Inserisci la tua password">
                <label for="password">Password</label>
            </div>

            <button type="submit">Accedi</button>

            <a href="signup.html" class="back-link">Registrati</a>
            <a href="../index.php" class="home-btn">Torna alla Home</a>
        </form>
    </div>
</div>

<footer>
    <p>&copy; 2026 Biblioteca Scolastica. Tutti i diritti riservati.</p>
    <p>Grazie per il tuo contributo alla nostra comunità di lettori!</p>
</footer>

<script src="../assets/js/login.js"></script>
</body>
</html>
