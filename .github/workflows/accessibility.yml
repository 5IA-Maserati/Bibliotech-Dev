name: Accessibility Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout repository
      - uses: actions/checkout@v4

      # 2. Run be-a11y on local files
      - name: Run accessibility checker
        id: a11ychecker
        uses: be-lenka/be-a11y@v2.2.8
        continue-on-error: true
        with:
          url: ${{ github.event.inputs.path }}
          report: ${{ github.event.inputs.report }}

      # 3. Upload accessibility report if exists
      - name: Upload accessibility report artifact
        if: steps.a11ychecker.outcome != 'success' && ${{ github.event.inputs.report != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: ${{ github.event.inputs.report }}

      # 4. Output artifact info
      - name: Output artifact path
        run: echo "Accessibility report saved at ${{ github.event.inputs.report }}"
