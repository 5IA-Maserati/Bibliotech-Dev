name: Deploy PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-pr:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # 1. Checkout main
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # 2. Create filtered branch
      # =========================
      - name: Create filtered deploy branch
        run: |
          git checkout -B deploy-update

          # clean everything except git
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +

          # bring only allowed files from main
          git checkout main -- src public composer.json composer.lock

      # =========================
      # 3. Commit filtered snapshot
      # =========================
      - name: Commit deploy snapshot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "Filtered deploy snapshot from main" || echo "No changes"

      # =========================
      # 4. Push temp branch
      # =========================
      - name: Push branch
        run: |
          git push origin deploy-update --force

      # =========================
      # 5. Create PR main → deploy
      # =========================
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: deploy
          head: deploy-update
          title: Deploy PR from main
          body: |
            Auto-generated deploy PR

            Source: main  
            Target: deploy  

            Contains filtered production-ready code.
          branch: deploy-update
