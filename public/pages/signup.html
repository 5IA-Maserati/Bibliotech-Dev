<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione | Biblioteca Digitale</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/style/login.css">
</head>
<body>

<header class="navbar">
    <div class="logo-area">
        <div class="logo-placeholder">LOGO 1</div>
        <div class="logo-placeholder">LOGO 2</div>
    </div>
    <div class="container">
        <h1>Biblioteca Digitale</h1>
        <p>Accedi o registrati per entrare nella piattaforma</p>
    </div>
</header>

<div class="login-container">
    <div class="login-card">
        <h2>Registrazione</h2>
        <p class="subtitle">Crea un nuovo account</p>

        <form id="register-form">
            <div class="input-group">
                <input type="text" id="nome" required aria-label="Inserisci il tuo nome">
                <label for="nome">Nome</label>
            </div>

            <div class="input-group">
                <input type="text" id="cognome" required aria-label="Inserisci il tuo cognome">
                <label for="cognome">Cognome</label>
            </div>

            <div class="input-group">
                <input type="date" id="data-nascita" required aria-label="Inserisci la tua data di nascita">
                <label class="fixed" for="data-nascita">Data di nascita</label>
            </div>

            <div class="input-group">
                <input type="email" id="email" required aria-label="Inserisci la tua email">
                <label for="email">Email</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" required aria-label="Inserisci la tua password">
                <label for="password">Password</label>
            </div>

            <div class="input-group">
                <input type="password" id="confirm-password" required aria-label="Conferma la tua password">
                <label for="confirm-password">Conferma password</label>
            </div>

            <button type="submit">Registrati</button>
        </form>

        <a href="login.html" class="back-link">← Torna al login</a>
        <a href="../index.php" class="home-btn">Torna alla Home</a>
    </div>
</div>

<footer>
    <p>&copy; 2026 Biblioteca Scolastica. Tutti i diritti riservati.</p>
    <p>Grazie per il tuo contributo alla nostra comunità di lettori!</p>
</footer>

<script src="../assets/js/signup.js"></script>
</body>
</html>
