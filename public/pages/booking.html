<!DOCTYPE html>
<html lang="it">
<head>

        <div class="description">

        </div>

        <form id="booking-form">
            <div class="input-group">
                <input type="text" id="name" name="name" aria-label="Nome dello studente" required>
                <label for="name">Nome dello Studente</label>
            </div>
            <div class="input-group">
                <input type="email" id="email" name="email" aria-label="Email dello studente" required>

                <input type="text" id="book-title" name="book_title" aria-label="Titolo del libro" required>
                <label for="book-title">Titolo del Libro</label>

            <div class="input-group">
                <input type="date" id="booking-date" name="booking_date" aria-label="Data di prenotazione" required>
